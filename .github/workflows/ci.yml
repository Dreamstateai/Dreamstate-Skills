name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.20.8, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      # Type-check + compile the TypeScript installer/build tooling to lib/.
      - run: npm run compile
      # Contract: every playbook's tools exist in the catalog, frontmatter valid.
      - run: npm run build
      # Determinism: committed dist/ must match what the playbooks generate.
      - run: npm run check
      # Config-writer round-trips + build assertions.
      - run: npm test
