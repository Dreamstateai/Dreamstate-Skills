name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Contract: every playbook's tools exist in the catalog, frontmatter valid.
      - run: npm run build
      # Determinism: committed dist/ must match what the playbooks generate.
      - run: npm run check
      # Config-writer round-trips + build assertions.
      - run: npm test
